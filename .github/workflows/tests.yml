name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.intl == ':intl' && ' / without intl' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        intl: ['intl']
        include:
          # Shared hosting often has no intl: the package's own tables are used
          - php: '8.3'
            intl: ':intl'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, pdo_sqlite, json, fileinfo, ${{ matrix.intl }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src tests bootstrap.php resources/lang resources/starters -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Report test failures as annotations
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Run the tests
        run: vendor/bin/phpunit
